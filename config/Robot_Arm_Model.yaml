sample_rate: 0.005

# 本调试工程只支持实际使用的 T7 / T170 双七轴配置。
T7:
  T170:
    robot_dof: 7
    right:
      alpha: [1.5707963267948966, 1.5707963267948966, 1.5707963267948966, -1.5707963267948966, 1.5707963267948966, -1.5707963267948966, -1.5707963267948966]
      a: [0, 0, 0, 0, 0, 0, 0]
      d: [0.191, 0, 0.270, 0, 0.250, 0, 0]
      offset: [1.5707963267948966, -1.5707963267948966, 1.5707963267948966, 0, 0, -1.5707963267948966, 0]
      tool: [0.230, 0, 0, 0, 0, 0]
      model_direct: [1, 1, 1, 1, 1, 1, 1]
      model_offset: [0, 1.5707963267948966, 0, 0, 0, 0, 0]
      # J2/J3 只比原限位稍宽，避免同一 TCP 解成肘内夹。J2 [-90,-5]→[-100,15]，J3 ±90→±100。
      # J6 是腕。准备姿态俯仰 40°、偏航 30° 的合法解大约要 J6 ±75°，±40° 会让逆解全部超限。
      joint_limit_min_deg: [-90, -100, -100, 0, -180, -90, -20]
      joint_limit_max_deg: [180, 15, 100, 140, 180, 90, 90]
      can_id_list: [16, 17, 18, 19, 20, 21, 22]
    left:
      alpha: [1.5707963267948966, 1.5707963267948966, 1.5707963267948966, -1.5707963267948966, 1.5707963267948966, -1.5707963267948966, -1.5707963267948966]
      a: [0, 0, 0, 0, 0, 0, 0]
      d: [-0.191, 0, 0.270, 0, 0.250, 0, 0]
      offset: [1.5707963267948966, -1.5707963267948966, 1.5707963267948966, 0, 0, -1.5707963267948966, 0]
      tool: [0.230, 0, 0, 0, 0, 0]
      model_direct: [-1, 1, 1, -1, 1, -1, 1]
      model_offset: [0, -1.5707963267948966, 0, 0, 0, 0, 0]
      # J2/J3 只比原限位稍宽。J2 [5,90]→[-15,100]，J3 ±90→±100。
      # J6 同上，左臂电机方向相反，限位仍按模型角 ±90°。
      joint_limit_min_deg: [-90, -15, -100, 0, -90, -90, -90]
      joint_limit_max_deg: [180, 100, 100, 140, 90, 90, 20]
      can_id_list: [23, 24, 25, 26, 27, 28, 29]
