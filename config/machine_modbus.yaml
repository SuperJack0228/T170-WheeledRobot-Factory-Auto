# 机床上下料 Modbus TCP。机器人主动访问保持寄存器，PLC 不推送。
# 协议与 modbustcp/ 相同：功能码 03 读、06 写，端口 502，从站号 1。
# 信号值写进对应寄存器：10/20 是机床就绪（我们去读），15/25/35/45 是机器人写回去。

port: 502
unit_id: 1
poll_ms: 200
connect_timeout_ms: 3000
default_wait_sec: 120

hosts:
  m88: 192.168.1.88
  m89: 192.168.1.89

# 两台上位机都有上料许可(10@2100)和下料许可(20@2200)，等待时两台都轮询。
# 写出仍按信号选寄存器：35/15→2150，45/25→2250；主机默认用最近等到许可的那台。
signals:
  10:
    addr: 2100
    dir: read
    name: 机床可以上料
  20:
    addr: 2200
    dir: read
    name: 机床可以下料
  35:
    addr: 2150
    dir: write
    name: 到预备上料点-锁定传送带
  15:
    addr: 2150
    dir: write
    name: 上料完成
  45:
    addr: 2250
    dir: write
    name: 到预备下料点-锁定传送带
  25:
    addr: 2250
    dir: write
    name: 下料完成
