# feeding_cylindrical_parts_alg 统一参数（算法 0 PnP + 算法 1 重心共用）
# 长度单位：米 (m)；图像阈值为像素 (px)
# YOLO class_id 须与训练 data.yaml 中 names 顺序一致

# 与训练 data.yaml names 一致（用于校验 classes 配置键名与 class_id）
yolo_class_names:
  0: original_product
  1: semi_finished_product
  2: finished_product
  3: feeding_hole

units:
  length: m

# ---------- 位姿算法选择 ----------
# 0 = 分割 + 圆盘 PnP（仅需 RGB）
# 1 = 分割 + mask 深度重心（需对齐 depth，单位 m）
algorithm:
  default_id: 0

# ---------- 分割模型 ----------
segmentation:
  model: models/bestlatest.pt
  conf: 0.25
  iou: 0.5  # 过滤大于该值的框
  imgsz: 1280        # 推理长边；1280×720 勿用默认 640，0=自动 max(H,W)
  retina_masks: true # 原图分辨率 mask，避免锯齿
  # 四类均参与推理和调试显示；C++ 抓取层仍只接受 class 0。
  class_ids: [0, 1, 2, 3]

# ---------- 类别几何（不同圆柱/圆盘直径） ----------
# 新增类别：在此增加一项，并填写 class_id、radius_m
defaults:
  radius_m: 0.0275
  enabled: true
  algorithm_id: 0

classes:
  original_product:
    class_id: 0
    radius_m: 0.0275       # 圆柱件半径 27.5 mm
    enabled: true
    algorithm_id: 1
    # 可选：覆盖下方 algorithm_pnp / algorithm_centroid 中的单项
    # pnp:
    #   max_reproj_mean: 12.0
    # centroid:
    #   min_depth_m: 0.04

  semi_finished_product:
    class_id: 1
    radius_m: 0.0275
    enabled: true
    algorithm_id: 1
  finished_product:
    class_id: 2
    radius_m: 0.0275
    enabled: true
    algorithm_id: 1
  feeding_hole:
    class_id: 3
    radius_m: 0.0275
    enabled: true
    algorithm_id: 1

# ---------- 算法 0：分割 + 圆盘 PnP ----------
algorithm_pnp:
  n_samples: 12
  reproj_thresh: 6.0
  max_reproj_mean: 10.0
  min_depth_m: 0.02
  min_normal_view_dot: 0.05
  min_ellipse_area_px: 500.0  # 拟合椭圆面积下限 (px²)，小于该值的目标被过滤

# ---------- 算法 1：分割 + mask 深度重心 ----------
algorithm_centroid:
  mask_erode_kernel: [9, 9]
  min_depth_m: 0.05
  min_points: 10
