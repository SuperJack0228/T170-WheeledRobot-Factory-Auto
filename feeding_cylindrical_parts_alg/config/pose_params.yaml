# feeding_cylindrical_parts_alg 统一参数
# 长度单位：米 (m)；图像阈值为像素 (px)
# YOLO class_id 须与训练 data.yaml 中 names 顺序一致

# 与 best1015.pt（倒件微调后的 yolo11n）内 model.names 一致。没有类别 3。
yolo_class_names:
  0: workpiece                 # 立件
  1: feeding_hole              # 空孔
  2: fallen                    # 倒件

units:
  length: m

# ---------- 位姿 / 关联点算法 ----------
# 0 = 分割 + 圆盘 PnP（需原生 mask）
# 1 = 分割 + mask 深度重心
# 2 = 检测框中心 + 深度粗点（关联用；best1015 detect 默认）
# detect 权重无 mask 时引擎强制走 2，与下列 default 无关。
algorithm:
  default_id: 2

# ---------- YOLO 模型 ----------
segmentation:
  # detect 权重：只出框+类别，不再造伪 mask。分割权重仍可走 0/1。
  # model 给头相机、料盘、传送带。hand_model 给左右手相机。类别号相同，不能混用。
  model: models/best1015.pt
  hand_model: models/best1027.pt
  conf: 0.25
  iou: 0.5  # 过滤大于该值的框
  imgsz: 1280        # 推理长边；1280×720 勿用默认 640，0=自动 max(H,W)
  retina_masks: true # 仅分割权重有意义；detect 忽略
  # 三类都参与推理。传送带零件计 0 和 2；料盘抓取用 0，料盘放置用 1。
  class_ids: [0, 1, 2]

# ---------- 类别几何（不同圆柱/圆盘直径） ----------
defaults:
  radius_m: 0.0275
  enabled: true
  algorithm_id: 2

classes:
  workpiece:
    class_id: 0
    radius_m: 0.0275       # 圆柱件半径 27.5 mm
    enabled: true
    algorithm_id: 2
  feeding_hole:
    class_id: 1
    radius_m: 0.0275
    enabled: true
    algorithm_id: 2
  fallen:
    class_id: 2
    radius_m: 0.0275
    enabled: true
    algorithm_id: 2

# ---------- 算法 0：分割 + 圆盘 PnP ----------
algorithm_pnp:
  n_samples: 12
  reproj_thresh: 6.0
  max_reproj_mean: 10.0
  min_depth_m: 0.02
  min_normal_view_dot: 0.05
  min_ellipse_area_px: 500.0  # 拟合椭圆面积下限 (px²)，小于该值的目标被过滤

# ---------- 算法 1：分割 + mask 深度重心 ----------
algorithm_centroid:
  mask_erode_kernel: [9, 9]
  min_depth_m: 0.05
  min_points: 10
