# 工厂单类检测（网页「视觉检测」专用）
# 权重用工程根目录 best.pt，不覆盖 models/best.pt（旧 4 类抓取模型）
# 长度单位：米 (m)

yolo_class_names:
  0: feeding_cylindrical_parts

units:
  length: m

algorithm:
  default_id: 1          # 0=PnP  1=mask 深度重心；小零件优先重心

segmentation:
  model: ../best.pt
  conf: 0.65
  iou: 0.5
  imgsz: 1280
  retina_masks: true
  class_ids: [0]

defaults:
  radius_m: 0.0275
  enabled: true
  algorithm_id: 1

classes:
  feeding_cylindrical_parts:
    class_id: 0
    radius_m: 0.0275
    enabled: true
    algorithm_id: 1

algorithm_pnp:
  n_samples: 12
  reproj_thresh: 6.0
  max_reproj_mean: 10.0
  min_depth_m: 0.02
  min_normal_view_dot: 0.05
  min_ellipse_area_px: 500.0

algorithm_centroid:
  mask_erode_kernel: [3, 3]   # 零件小，9×9 腐蚀容易把 mask 掏空
  min_depth_m: 0.05
  # 头相机光轴深度上限。桌上零件约 0.52~0.62m（零件高 2~4cm 已含在内），
  # 桌下地面约 1.58m。0=不限制。改 yaml 后只需重启 run.sh，不用重新编译。
  max_depth_m: 1.0
  min_points: 10
