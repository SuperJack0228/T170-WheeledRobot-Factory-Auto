# seg_circle_pose 统一参数（算法 0 PnP + 算法 1 重心共用）
# 长度单位：米 (m)；图像阈值为像素 (px)
# YOLO class_id 须与训练 data.yaml 中 names 顺序一致

units:
  length: m

# ---------- 位姿算法选择 ----------
# 0 = 分割 + 圆盘 PnP（仅需 RGB）
# 1 = 分割 + mask 深度重心（需对齐 depth，单位 m）
algorithm:
  default_id: 0

# ---------- 分割模型 ----------
segmentation:
  model: models/best.pt
  conf: 0.25
  iou: 0.5  # 过滤大于该值的框
  # 仅推理这些 class_id；留空或 null 表示不过滤
  class_ids: null  # 仅推理这些 class_id；留空或 null 表示不过滤

# ---------- 类别几何（不同圆柱/圆盘直径） ----------
# 新增类别：在此增加一项，并填写 class_id、radius_m
defaults:
  radius_m: 0.0275
  enabled: true
  algorithm_id: 0

classes:
  feeding_cylindrical_parts:
    class_id: 0
    radius_m: 0.0275
    enabled: true
    algorithm_id: 0
    # 可选：覆盖下方 algorithm_pnp / algorithm_centroid 中的单项
    # pnp:
    #   max_reproj_mean: 12.0
    # centroid:
    #   min_depth_m: 0.04

  # example_future_part:
  #   class_id: 1
  #   radius_m: 0.020
  #   enabled: true

# ---------- 算法 0：分割 + 圆盘 PnP ----------
algorithm_pnp:
  n_samples: 12
  reproj_thresh: 6.0
  max_reproj_mean: 10.0
  min_depth_m: 0.02
  min_normal_view_dot: 0.05

# ---------- 算法 1：分割 + mask 深度重心 ----------
algorithm_centroid:
  mask_erode_kernel: [9, 9]
  min_depth_m: 0.05
  min_points: 10
