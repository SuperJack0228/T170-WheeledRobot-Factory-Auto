# 工程: board_belt_aruco
# 圆方传送带，T170C。DICT_5X5_1000，平贴，外框 30 mm。
# 黑框由格数算出：5 格数据 + 黑边各 1 + 白边各 1 = 9 格，黑框 = 30×7/9 = 23.333 mm。
#
# 码在上表面，码的「上」朝传送带前方。原点 = 两码心连线中点。+X 前 +Y 左 +Z 上。
# 两码沿左右（Y）排列，中心距 109 mm：左码 +Y，右码 −Y。
#
#              前 (+X)  边缘 +152 mm
# 左(+Y)  定位 500       原点        信息 550/551  右(−Y)
#        边缘 +167 mm                    边缘 −70 mm
#              后 (−X)  边缘 −152 mm
#
# 本期两条共用定位码 500，靠右信息码区分：
# 皮带 0 = YF-0001：左 500、右 550
# 皮带 1 = YF-0002：左 500、右 551

aruco:
  dictionary: DICT_5X5_1000
  print_size_m: 0.03
  bit_cells: 5
  black_border_cells: 1
  white_border_cells: 1

belt:
  pitch_y_m: 0.109                # 两码心左右间距
  edge:
    front_m: 0.152                # +X 到前边缘
    rear_m: 0.152                 # −X 到后边缘
    left_m: 0.167                 # +Y 到左边缘
    right_m: 0.070                # −Y 到右边缘
  items:
    - name: belt0
      left_id: 500
      right_id: 550
    - name: belt1
      left_id: 500
      right_id: 551

pose:
  pnp_flag: SQPNP
  pnp_refine: true
  min_markers: 1

camera:
  width: 1920
  height: 1080
  fps: 30
  serial: ""

display:
  axis_length_m: 0.08
  print_pose_every_n_frames: 15
  save_dir: captures
  window_name: board_belt_aruco
