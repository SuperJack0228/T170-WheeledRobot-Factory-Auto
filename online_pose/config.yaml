# t170c_debug 的头相机 ArUco 引擎读取这份配置。
# 按码 ID 查边长再 PnP；没写进任何一组的码，用 default_side_length_m。

aruco:
  dictionary: DICT_5X5_1000
  default_side_length_m: 0.04   # 未登记 ID 的默认边长（米）
  sizes:
    - side_length_m: 0.02       # 20 mm；部署前按标记黑色外框实测复核
      ids: [0, 2, 20, 25, 26, 113, 114]
    - side_length_m: 0.04       # 40 mm；部署前按标记黑色外框实测复核
      ids: [59, 61, 64]

pose:
  pnp_flag: IPPE_SQUARE
  pnp_refine: true

display:
  axis_length_ratio: 0.5
